# Confere o formato .iris4d.json (o plugin só compila no Windows com o Navisworks instalado).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/teste_formato-iris4d.py
