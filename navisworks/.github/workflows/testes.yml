# Confere o formato .iris4d.json (o plugin só compila no Windows com o Navisworks instalado).
# Só roda à mão (Actions › Testes › Run workflow): o teste roda no ambiente do Claude antes de cada versão,
# como no Iris, para poupar o orçamento do GitHub Actions.
name: Testes
on:
  workflow_dispatch:
jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/teste_formato-iris4d.py
