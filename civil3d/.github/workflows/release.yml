# Publica uma release quando a <Version> do src/MetroSP.csproj muda na main.
# Só roda quando o csproj, o instalador ou este arquivo mudam, para gastar poucos minutos do Actions
# (nada roda a cada push). Se a tag v<versão> já existe, não faz nada. Também pode ser rodado à mão em Actions.
# Artefatos: só o instalador .exe e o .zip, anexados à release (nada fica guardado no Actions).
name: Release

on:
  push:
    branches: [main]
    paths:
      - src/MetroSP.csproj
      - .github/workflows/release.yml
      - installer/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: versao
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/MetroSP.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $v) { throw 'Version não encontrada no src/MetroSP.csproj' }
          $existe = git tag -l "v$v"
          "versao=$v" >> $env:GITHUB_OUTPUT
          "existe=$([bool]$existe)".ToLower() >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "Tag v$v já existe: nada a publicar." }

      - uses: actions/setup-dotnet@v4
        if: steps.versao.outputs.existe == 'false'
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compilar e empacotar
        if: steps.versao.outputs.existe == 'false'
        shell: pwsh
        run: |
          $v = '${{ steps.versao.outputs.versao }}'
          $notas = Get-Content NOTAS-DA-VERSAO.md -Raw -Encoding UTF8
          $m = [regex]::Match($notas, "(?ms)^## $([regex]::Escape($v))\b.*?(?=^## )")
          if (-not $m.Success) { throw "NOTAS-DA-VERSAO.md não tem a seção ## $v" }
          Set-Content notas-release.md $m.Value -Encoding UTF8
          ./build.ps1
          if (-not (Test-Path "MetroSP-Civil3D-Setup-$v.exe")) { throw 'Instalador não gerado (Inno Setup)' }

      - name: Publicar release
        if: steps.versao.outputs.existe == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.versao.outputs.versao }}'
          gh release create "v$v" "MetroSP-Civil3D-Setup-$v.exe" "metrosp-civil3d-$v.zip" --target $env:GITHUB_SHA --title "MetroSP para Civil 3D $v" --notes-file notas-release.md
